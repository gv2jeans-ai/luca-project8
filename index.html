<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>전문가 컨설팅 신청</title>
    <style>
        * { box-sizing: border-box; margin: 0; padding: 0; font-family: 'Pretendard', sans-serif; }
        body { background-color: #f5f7fa; color: #333; display: flex; justify-content: center; padding: 40px 20px; }
        .container { background: #fff; width: 100%; max-width: 800px; border-radius: 12px; box-shadow: 0 4px 20px rgba(0,0,0,0.08); padding: 32px; }
        h1 { text-align: center; margin-bottom: 24px; color: #1a2530; font-size: 24px; }
        
        /* Step Navigation */
        .steps { display: flex; justify-content: space-between; margin-bottom: 32px; border-bottom: 2px solid #edf2f7; padding-bottom: 16px; }
        .step { font-weight: 600; color: #a0aec0; font-size: 14px; }
        .step.active { color: #3182ce; border-bottom: 2px solid #3182ce; padding-bottom: 14px; margin-bottom: -16px; }
        
        /* Content Section */
        .section-title { font-size: 18px; margin-bottom: 16px; color: #2d3748; }
        .grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(220px, 1fr)); gap: 12px; margin-bottom: 24px; }
        .card { border: 2px solid #e2e8f0; border-radius: 8px; padding: 16px; cursor: pointer; transition: all 0.2s; text-align: center; }
        .card:hover { border-color: #cbd5e0; background-color: #f8fafc; }
        .card.selected { border-color: #3182ce; background-color: #ebf8ff; color: #2b6cb0; font-weight: bold; }
        
        .code-badge { font-size: 12px; color: #718096; display: block; margin-top: 4px; font-weight: normal; }
        
        /* Buttons */
        .btn-group { display: flex; justify-content: space-between; margin-top: 32px; }
        button { padding: 10px 24px; border-radius: 6px; border: none; font-size: 15px; font-weight: 600; cursor: pointer; }
        .btn-prev { background: #e2e8f0; color: #4a5568; }
        .btn-next { background: #3182ce; color: white; }
        button:disabled { background: #cbd5e0; cursor: not-allowed; }
    </style>
</head>
<body>

<div class="container">
    <h1>전문가 컨설팅 신청</h1>
    
    <div class="steps">
        <div class="step" id="step-nav-1">1. 학교급 선택</div>
        <div class="step" id="step-nav-2">2. 권역 선택</div>
        <div class="step" id="step-nav-3">3. 과목 선택</div>
        <div class="step" id="step-nav-4">4. 완료</div>
    </div>

    <div id="step-content"></div>

    <div class="btn-group">
        <button class="btn-prev" id="btn-prev" onclick="prevStep()">이전</button>
        <button class="btn-next" id="btn-next" onclick="nextStep()">다음</button>
    </div>
</div>

<script>
    // 1. 학교급 데이터
    const SCHOOL_LEVELS = [
        { id: 'middle', name: '중학교' },
        { id: 'high', name: '고등학교' }
    ];

    // 2. 권역 데이터
    const ZONES = ['1권역', '2권역', '3권역', '4권역'];

    // 3. 과목 데이터 (고등학교 6개 공통과목 포함)
    const SUBJECTS = [
        // 중학교 과목
        { id: 'm_kor', level: 'middle', dept: '국어과', name: '중학교 국어', code: '[9국01-01]' },
        { id: 'm_math', level: 'middle', dept: '수학과', name: '중학교 수학', code: '[9수01-01]' },
        { id: 'm_sci', level: 'middle', dept: '과학과', name: '중학교 과학', code: '[9과01-01]' },
        { id: 'm_soc', level: 'middle', dept: '사회과', name: '중학교 사회', code: '[9사01-01]' },
        { id: 'm_eng', level: 'middle', dept: '영어과', name: '중학교 영어', code: '[9영01-01]' },
        
        // 고등학교 과목 (2022 개정 교육과정 공통 6개 과목)
        { id: 'h_kor', level: 'high', dept: '국어과', name: '공통국어', code: '[10공국02-02]' },
        { id: 'h_math', level: 'high', dept: '수학과', name: '공통수학', code: '[10공수01-03]' },
        { id: 'h_sci', level: 'high', dept: '과학과', name: '통합과학', code: '[10통과05-02]' },
        { id: 'h_exp', level: 'high', dept: '과학과', name: '과학탐구실험', code: '[10과탐01-02]' },
        { id: 'h_soc', level: 'high', dept: '사회과', name: '통합사회', code: '[10통사02-03]' },
        { id: 'h_his', level: 'high', dept: '사회과', name: '한국사', code: '[10한사03-01]' }
    ];

    // 상태 관리 변수
    let currentStep = 1;
    let selectedSchool = SCHOOL_LEVELS[0];
    let selectedZone = ZONES[0];
    let selectedSubject = SUBJECTS.find(s => s.level === 'middle');

    // 학교급 변경 핸들러 (고등학교 클릭 시 과목 자동 업데이트)
    function selectSchool(id) {
        selectedSchool = SCHOOL_LEVELS.find(s => s.id === id);
        
        // 해당 학교급의 첫 번째 과목으로 자동 변경
        const availableSubjects = SUBJECTS.filter(s => s.level === id);
        if (availableSubjects.length > 0) {
            selectedSubject = availableSubjects[0];
        }
        render();
    }

    function selectZone(zone) {
        selectedZone = zone;
        render();
    }

    function selectSubject(id) {
        selectedSubject = SUBJECTS.find(s => s.id === id);
        render();
    }

    function nextStep() {
        if (currentStep < 4) {
            currentStep++;
            render();
        }
    }

    function prevStep() {
        if (currentStep > 1) {
            currentStep--;
            render();
        }
    }

    // 화면 렌더링 함수
    function render() {
        // 네비게이션 상태 업데이트
        for (let i = 1; i <= 4; i++) {
            const nav = document.getElementById(`step-nav-${i}`);
            if (i === currentStep) nav.classList.add('active');
            else nav.classList.remove('active');
        }

        // 이전/다음 버튼 제어
        document.getElementById('btn-prev').disabled = currentStep === 1;
        document.getElementById('btn-next').innerText = currentStep === 4 ? '신청완료' : '다음';

        const content = document.getElementById('step-content');
        
        // STEP 1: 학교급 선택
        if (currentStep === 1) {
            content.innerHTML = `
                <div class="section-title">학교급을 선택하세요</div>
                <div class="grid">
                    ${SCHOOL_LEVELS.map(s => `
                        <div class="card ${selectedSchool.id === s.id ? 'selected' : ''}" onclick="selectSchool('${s.id}')">
                            ${s.name}
                        </div>
                    `).join('')}
                </div>
            `;
        } 
        // STEP 2: 권역 선택
        else if (currentStep === 2) {
            content.innerHTML = `
                <div class="section-title">권역을 선택하세요</div>
                <div class="grid">
                    ${ZONES.map(z => `
                        <div class="card ${selectedZone === z ? 'selected' : ''}" onclick="selectZone('${z}')">
                            ${z}
                        </div>
                    `).join('')}
                </div>
            `;
        } 
        // STEP 3: 담당 과목 선택 (학교급 필터링 적용)
        else if (currentStep === 3) {
            const filteredSubjects = SUBJECTS.filter(s => s.level === selectedSchool.id);
            content.innerHTML = `
                <div class="section-title">${selectedSchool.name} 담당 과목 선택 (${filteredSubjects.length}개)</div>
                <div class="grid">
                    ${filteredSubjects.map(s => `
                        <div class="card ${selectedSubject.id === s.id ? 'selected' : ''}" onclick="selectSubject('${s.id}')">
                            <div><strong>${s.name}</strong></div>
                            <span class="code-badge">${s.dept} \vert{}${s.code}</span>
                        </div>
                    `).join('')}
                </div>
            `;
        } 
        // STEP 4: 최종 확인
        else if (currentStep === 4) {
            content.innerHTML = `
                <div class="section-title">신청 내용을 확인해주세요</div>
                <div style="background:#f7fafc; padding:20px; border-radius:8px; line-height:2;">
                    <p><strong>학교급:</strong> ${selectedSchool.name}</p>
                    <p><strong>권역:</strong> ${selectedZone}</p>
                    <p><strong>선택 과목:</strong> ${selectedSubject.name} (${selectedSubject.code})</p>
                </div>
            `;
        }
    }

    // 최초 실행
    render();
</script>

</body>
</html>
